[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-sentinel"
version = "0.1.0"
description = "Autonomous GitHub pull request reviewer powered by Claude"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.3,<3", "httpx>=0.27", "pydantic>=2.7", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
