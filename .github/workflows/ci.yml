name: CI

# Runs the project's tests. No secrets, read-only token. PR Sentinel requires the `tests` check to pass on the
# exact head commit before it merges code, and dispatches this workflow after pushing an autofix (pushes made
# with GITHUB_TOKEN don't trigger workflows by themselves).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest
      - run: pytest -q
