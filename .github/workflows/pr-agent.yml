name: Autonomous PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  # Commenting on a PR with GITHUB_TOKEN needs pull-requests: write; issues: write alone returned 403 on PR #3.
  pull-requests: write
  issues: write
  # Read CI check runs and annotations for the reviewed head commit (Milestone 2, read-only).
  checks: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # The check-run name. PR Sentinel ignores its own check when reading CI (PR_SENTINEL_SELF_CHECK must match).
    name: PR Sentinel review
    # Same-repo branches only. Never switch to pull_request_target to run untrusted PR code with secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Run trusted code from the default branch, not the untrusted PR head.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install .
      - name: Review PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -m pr_agent.cli --repo "$REPO" --pr "$PR_NUMBER" --publish
      - name: Build run dashboard
        if: always() && hashFiles('artifacts/run_result.json') != ''
        continue-on-error: true
        run: python -m pr_agent.dashboard --input artifacts/run_result.json --trace artifacts/actions.jsonl --output artifacts/dashboard.html
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-sentinel-run
          path: artifacts/
          if-no-files-found: ignore
